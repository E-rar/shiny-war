<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiny War · PokeMMO Team Tracker</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#2b3444;
    --text:#e6edf3; --muted:#8b98a9; --accent:#ffd23f; --accent2:#5ac8fa;
    --good:#3fb950; --warn:#e3b341; --bad:#f85149;
    --t0:#ffd23f; --t1:#ff9f45; --t2:#ff6f91; --t3:#c678dd;
    --t4:#5ac8fa; --t5:#3fb950; --t6:#8b98a9; --t7:#5c6b7a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#182030,#0d1117 60%);
    color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
  header{padding:22px 20px 10px;text-align:center}
  h1{margin:0;font-size:26px;letter-spacing:.5px}
  h1 .spark{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:16px 0}
  .btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:18px 0}
  .tab{padding:10px 16px;border-radius:10px 10px 0 0;background:var(--panel);border:1px solid var(--border);
    border-bottom:none;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500}
  .tab.active{background:var(--panel2);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:17px}
  .card .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  tr:hover td{background:rgba(255,255,255,.02)}
  .rank{font-weight:700;font-size:16px;width:52px}
  .rank.g1{color:#ffd23f}.rank.g2{color:#c9d1d9}.rank.g3{color:#e0925f}
  .pts{font-weight:700;color:var(--accent);font-size:15px;text-align:right}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#10141c}
  .chip{display:inline-block;padding:3px 9px;border-radius:7px;font-size:12px;background:var(--panel2);
    border:1px solid var(--border);margin:2px 3px 2px 0}
  .warnrow td{background:rgba(227,179,65,.07)}
  .dup{color:var(--warn);font-weight:700}
  .name-input{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;
    padding:4px 8px;font-size:13px;width:150px}
  .split-row{display:flex;align-items:center;gap:10px;margin:7px 0}
  .split-label{width:150px;font-size:13px;flex-shrink:0;text-align:right;color:var(--text)}
  .split-track{flex:1;background:var(--panel2);border-radius:6px;height:22px;position:relative;overflow:hidden}
  .split-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;
    font-size:12px;font-weight:700;color:#10141c;min-width:26px;transition:width .4s}
  .split-count{width:38px;font-size:13px;color:var(--muted)}
  .drop{border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;color:var(--muted);
    font-size:14px;transition:.15s;cursor:pointer}
  .drop.hot{border-color:var(--accent);color:var(--accent);background:rgba(255,210,63,.05)}
  .status{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px}
  .status.ok{color:var(--good)}.status.err{color:var(--bad)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}.split-label{width:96px}}
  .muted{color:var(--muted)}
  .ktag{font-size:11px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  .spr{width:34px;height:34px;object-fit:contain;vertical-align:middle;image-rendering:auto;flex-shrink:0}
  .mono{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:#10141c;vertical-align:middle;flex-shrink:0}
  .spwrap{display:inline-flex;align-items:center;gap:8px}
  .spr-sm{width:22px;height:22px;object-fit:contain;vertical-align:middle}
  #toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);
    background:var(--good);color:#08120a;padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:.3s;z-index:999;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  #toast.err{background:var(--bad);color:#fff}
  #toTop{position:fixed;bottom:22px;right:22px;width:46px;height:46px;border-radius:50%;background:var(--accent);
    color:#1a1a1a;border:none;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45);
    opacity:0;visibility:hidden;transform:translateY(12px);transition:.2s;z-index:998}
  #toTop.show{opacity:1;visibility:visible;transform:translateY(0)}
  #toTop:hover{filter:brightness(1.08)}
  .seasonbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 0}
  .season{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--panel);
    cursor:pointer;font-size:13px;color:var(--muted);transition:.15s}
  .season:hover{border-color:var(--accent2)}
  .season.active{color:#10141c;font-weight:700;border-color:transparent}
  .season.active[data-s="fruehling"]{background:#7bd88f}
  .season.active[data-s="sommer"]{background:#ffd23f}
  .season.active[data-s="herbst"]{background:#ff9f45}
  .season.active[data-s="winter"]{background:#8fd3ff}
  .season.timechip.active{background:#b98cff;color:#10141c;border-color:transparent}
  .hcard{position:relative;border:1px solid var(--border);border-radius:11px;padding:14px;margin-bottom:12px;background:var(--panel2)}
  .hcard.ranked{padding-left:46px}
  .rankno{position:absolute;top:10px;left:8px;width:30px;text-align:center;font-weight:800;font-size:15px;color:var(--muted);line-height:1.1}
  .rankno small{display:block;font-size:8px;font-weight:600;letter-spacing:.5px;color:var(--muted);opacity:.7}
  .rankno.top1{color:#ffd23f}.rankno.top2{color:#c7d0da}.rankno.top3{color:#e0965a}
  .hcard h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hcard .loc-note{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  .hactions{margin-left:auto;display:flex;gap:6px}
  .mrow{display:flex;align-items:center;gap:10px;margin:5px 0}
  .mrow .mname{width:150px;flex-shrink:0;font-size:13px;display:flex;align-items:center;gap:7px}
  .mrow .mtrack{flex:1;background:var(--panel);border-radius:6px;height:20px;overflow:hidden}
  .mrow .mfill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:7px;font-size:11px;font-weight:700;color:#10141c;min-width:22px}
  .mrow .mpct{width:44px;text-align:right;font-size:13px;color:var(--muted)}
  .stacked{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--border);margin:8px 0}
  .stacked > div{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#10141c;min-width:0;overflow:hidden;white-space:nowrap}
  .evexp{font-size:12.5px;color:var(--muted)}
  .evexp b{color:var(--accent)}
  /* Editor */
  .editor{border:1px dashed var(--accent);border-radius:11px;padding:16px;margin-bottom:16px;background:rgba(255,210,63,.04)}
  .editor .frow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .editor input,.editor select{background:var(--bg);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:7px 9px;font-size:13px}
  .ed-loc{flex:2;min-width:160px}.ed-region{flex:1;min-width:120px}.ed-note{flex:3;min-width:180px}
  .edrow{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap;padding:6px;border-radius:8px;background:var(--panel)}
  .edrow .em_name{flex:2;min-width:130px}
  .seasin{width:58px !important;text-align:center}
  .tod-sel{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px;font-size:11px;max-width:120px}
  .seaslab{font-size:10px;color:var(--muted);width:58px;text-align:center;display:inline-block}
  .edhead{display:flex;gap:6px;padding:0 6px 2px 140px;flex-wrap:wrap}
  .xbtn{background:transparent;border:none;color:var(--bad);cursor:pointer;font-size:16px;padding:0 4px}
  .em_prev{width:26px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .em_en{min-width:74px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .editor input.bad{border-color:var(--bad) !important;background:rgba(248,81,73,.08)}
  .editor input.good{border-color:var(--good) !important}
  .bad-txt{color:var(--bad) !important}
  .chip.tl-open{cursor:pointer;transition:.12s}
  .chip.tl-open:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .chip.tl-done{opacity:.5}
  .chip.tl-done s{text-decoration-color:var(--good)}
  .badge.meth-horde5{background:#5ac8fa;color:#10141c}
  .badge.meth-horde3{background:#c678dd;color:#10141c}
  .badge.meth-angeln{background:#47c8b0;color:#10141c}
  .badge.meth-single{background:#9aa7b5;color:#10141c}
  .ed-size{min-width:120px}
  .em_lure{vertical-align:middle}
  .lure-lbl{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
  .hab-sel{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:3px 6px;font-size:12px;cursor:pointer}
  @media(max-width:720px){.mrow .mname{width:110px}.edhead{padding-left:6px}}
  code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:12.5px;color:var(--accent2)}
  pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;font-size:12px;color:var(--muted)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:11px}
  .legend span{display:flex;align-items:center;gap:4px;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<header>
  <h1><span class="spark">✦</span> Shiny War <span class="spark">✦</span></h1>
  <div class="sub">PokeMMO Team-Tracker · Horden · Spezies-Split · Punkte-Leaderboard</div>
</header>

<div class="wrap">
  <div class="bar" id="loadbar">
    <button class="btn primary" onclick="document.getElementById('file').click()">📂 hunts.json laden</button>
    <input type="file" id="file" accept=".json" style="display:none">
    <button class="btn" onclick="document.getElementById('dbfile').click()">🖼️ pokemon_data.json (Bilder)</button>
    <input type="file" id="dbfile" accept=".json" style="display:none">
    <button class="btn" onclick="loadFromUrl()">🌐 Von URL laden</button>
    <button class="btn" onclick="exportHunts()">⬇ hunts.json</button>
    <button class="btn" onclick="useDemo()">↺ Beispieldaten</button>
  </div>
  <div id="modeline" style="text-align:center;margin:2px 0 6px"></div>
  <div class="status" id="status">Beispieldaten geladen · <span class="ktag">Bilder werden von der PokeAPI geladen…</span></div>

  <div class="seasonbar" id="seasonbar"></div>

  <div class="tabs">
    <div class="tab" data-tab="lb" onclick="showTab('lb')">🏆 Leaderboard</div>
    <div class="tab" data-tab="hunt" onclick="showTab('hunt')">🎯 Wer huntet was</div>
    <div class="tab active" data-tab="loc" onclick="showTab('loc')">🗺️ Horden</div>
    <div class="tab" data-tab="tier" onclick="showTab('tier')">📋 Tierlist</div>
  </div>

  <div id="view"></div>
</div>
<div id="toast"></div>
<button id="toTop" title="Nach oben" aria-label="Nach oben" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

/* Lookup: jeder deutsche Name + englischer Basisname + englische Weiterentwicklungen -> Linie */
const LOOKUP={};
for(const line of LINES){
  for(const nm of line.n) LOOKUP[norm(nm)]=line;
  LOOKUP[norm(line.e)]=line;
  const evs=EN_LINES[line.e]; if(evs) for(const en of evs) LOOKUP[norm(en)]=line;
}
/* POKEDB: aus pokemon_data.json, dauerhaft gespeichert (einmal laden reicht)
   PKMN_INDEX: norm(engl. Name) -> Dex-ID, einmalig von PokeAPI (für Bilder ohne Datei) */
let POKEDB=loadPokedb();
function loadPokedb(){try{return JSON.parse(localStorage.getItem("sw_pokedb")||"{}")}catch(e){return{}}}
function savePokedb(){try{localStorage.setItem("sw_pokedb",JSON.stringify(POKEDB))}catch(e){}}
let PKMN_INDEX=loadPkmnIndex();
function loadPkmnIndex(){try{return JSON.parse(localStorage.getItem("sw_pkmn2")||"{}")}catch(e){return{}}}
function savePkmnIndex(){try{localStorage.setItem("sw_pkmn2",JSON.stringify(PKMN_INDEX))}catch(e){}}
function spriteUrlById(id){return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/"+id+".png";}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}

function dexIdFor(name){
  const rec=POKEDB[norm(name)]; if(rec&&rec.id) return rec.id;
  if(PKMN_INDEX[norm(name)]) return PKMN_INDEX[norm(name)];
  const l=LOOKUP[norm(name)];
  if(l){ if(PKMN_INDEX[norm(l.e)]) return PKMN_INDEX[norm(l.e)];
    const r2=POKEDB[norm(l.e)]||POKEDB[norm(l.n[0])]; if(r2&&r2.id) return r2.id; }
  return null;
}
async function fetchPkmnIndex(){
  if(Object.keys(PKMN_INDEX).length>50) return; // schon im Cache
  try{
    // pokemon-species kennt die einfachen Basisnamen (z. B. basculin/frillish/yamask) inkl. Dex-ID
    const r=await fetch("https://pokeapi.co/api/v2/pokemon-species?limit=100000");
    const j=await r.json();
    for(const e of j.results){ const m=e.url.match(/\/pokemon-species\/(\d+)\//); if(m) PKMN_INDEX[norm(e.name)]=Number(m[1]); }
    savePkmnIndex(); if(typeof render==="function") render();
  }catch(e){/* offline -> Bilder ggf. nur mit pokemon_data.json */}
}

function resolve(name){
  let l=LOOKUP[norm(name)];
  if(l) return l;
  const rec=POKEDB[norm(name)];
  if(rec){ l=LOOKUP[norm(rec.name_de)]||LOOKUP[norm(rec.name_en)]; if(l) return l; }
  return null;
}
function spriteFor(name){
  const rec=POKEDB[norm(name)]; if(rec&&rec.sprite) return rec.sprite;
  const id=dexIdFor(name); if(id) return spriteUrlById(id);
  return null;
}
/* Nur echte Pokémon zulassen (Tierlist ODER PokeAPI/POKEDB) */
function isValidSpecies(name){const k=norm(name);return !!k&&!!(LOOKUP[k]||POKEDB[k]||PKMN_INDEX[k]);}
function speciesLabels(name){
  // Zeigt die SPEZIFISCHE Stufe (nicht die Basis). Deutschen Namen bevorzugt aus POKEDB.
  const rec=POKEDB[norm(name)];
  if(rec) return {de:rec.name_de?cap(rec.name_de):cap(name), en:rec.name_en?cap(rec.name_en):cap(name)};
  return {de:cap(name), en:cap(name)};
}
function labelText(name){
  const l=speciesLabels(name);
  if(l.de&&l.en&&norm(l.de)!==norm(l.en)) return l.de+" · "+l.en;
  return l.de||l.en||"";
}
function canonSpecies(name){const rec=POKEDB[norm(name)];if(rec&&rec.name_de)return cap(rec.name_de);return cap(name);}
function memName(name){return speciesLabels(name).de||cap(name);}
/* Deutscher Anzeigename: spezifische Stufe aus POKEDB, sonst deutscher Basisname der Linie */
function deName(slug,line){
  const rec=POKEDB[norm(slug)];
  if(rec&&rec.name_de) return cap(rec.name_de);
  return line?line.n[0]:displayName(slug);
}
function icon(name,line,size){
  const s=spriteFor(name);
  if(s) return `<img class="spr${size==='sm'?' spr-sm':''}" src="${s}" alt="" loading="lazy">`;
  const t=line?line.t:6;
  const label=(line?line.n[0]:name||"?").slice(0,2).toUpperCase();
  return `<span class="mono${size==='sm'?' spr-sm':''}" style="background:${TIER_COLORS[t]}">${label}</span>`;
}
function displayName(slug){
  const l=resolve(slug);
  if(l) return l.n[0];
  // unbekannt: erste Buchstabe groß
  return slug ? slug.charAt(0).toUpperCase()+slug.slice(1) : "?";
}

const CTYPES=[["legendary","★ Legendär/Mythos",200],["alpha","α Alpha",75],["egg","🥚 Egg",35],["secret","🔒 Secret",20],["safari","🌴 Safari",10]];

function computeScores(){
  // Chronologisch (nach Datum, dann Eingabereihenfolge), um "zuerst" korrekt zu bestimmen
  const cs=(DATA.caught||[]).map((c,i)=>({c,i}))
    .sort((a,b)=>{const da=a.c.date||"",db=b.c.date||"";return da<db?-1:da>db?1:a.i-b.i;});
  const per={}, teamLines=new Set(), playerLines={}, unknown=new Set();
  let teamBonusTotal=0;
  for(const {c,i} of cs){
    const id=String(c.user_id);
    const line=resolve(c.pokemon);
    const f=flagsFor(c);
    const scored = line || f.legendary || f.alpha || f.egg || f.secret || f.safari;
    if(!per[id]) per[id]={pts:0,bonusPts:0,catches:[]};
    if(!scored){ // nicht in Tierlist & kein Sonderfall -> 0 Punkte
      unknown.add(c.pokemon);
      per[id].catches.push({name:deName(c.pokemon,null),tier:null,pts:0,bonus:0,tag:"untiered",date:c.date,idx:i,f});
      continue;
    }
    const key = line ? "L:"+norm(line.e) : "S:"+norm(c.pokemon);
    const tierVal = line?line.p:0;
    if(!playerLines[id]) playerLines[id]=new Set();
    const isDup=playerLines[id].has(key);
    let base,tag;
    if(f.legendary){ base=200; tag="legendary"; }
    else if(f.alpha){ base=75; tag="alpha"; }
    else if(f.egg){ base=Math.max(35,tierVal); tag="egg"; }
    else if(isDup){ base=1; tag="dup"; }
    else { base=tierVal; tag=line?"first":"flag"; }
    const uniqueB = teamLines.has(key)?0:8;       // Team-Erstfang der Linie
    let bonus=uniqueB;
    if(f.secret) bonus+=20;
    if(f.safari) bonus+=10;
    teamLines.add(key); playerLines[id].add(key);
    per[id].pts += base+bonus;
    per[id].bonusPts += bonus;
    teamBonusTotal += uniqueB;
    per[id].catches.push({name:deName(c.pokemon,line),tier:line?line.t:null,pts:base,bonus,tag,date:c.date,e:line?line.e:null,idx:i,f});
  }
  const rows=Object.entries(per).map(([id,v])=>({id,...v}))
    .sort((a,b)=>b.pts-a.pts || b.catches.length-a.catches.length);
  // Competition ranking (Gleichstand -> höhere Position, Regel des Events)
  let rank=0,prev=null,seen=0;
  for(const r of rows){ seen++; if(r.pts!==prev){rank=seen;prev=r.pts;} r.rank=rank; }
  return {rows,unknown:[...unknown],teamBonus:teamBonusTotal,uniqueLines:teamLines.size};
}

function activeList(){
  // [{line|null, slug, hunters:[ids]}]
  const out=[];
  for(const [slug,ids] of Object.entries(DATA.active||{})){
    out.push({slug,line:resolve(slug),hunters:ids.map(String)});
  }
  out.sort((a,b)=>{
    const pa=a.line?a.line.p:-1, pb=b.line?b.line.p:-1;
    return pb-pa || b.hunters.length-a.hunters.length;
  });
  return out;
}

/* ---------- Horden-Helfer ---------- */
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function seasonLabel(){return (SEASONS.find(x=>x[0]===SEASON)||["","?"])[1];}
function hordeSize(hd){return hd.size===3?3:5;} // Kompatibilität (alte Daten)
/* Encounter-Methoden: [key, Label, max. Encounter/Stunde] */
const METHODS=[["horde5","🐾 5er-Horde",1200],["horde3","🐾 3er-Horde",720],["angeln","🎣 Angeln",450],["single","👤 Single",250]];
function methodOf(hd){return hd.method||(hd.size===3?"horde3":"horde5");} // Fallback aus alter size
function methodInfo(k){return METHODS.find(m=>m[0]===k)||METHODS[0];}
function methodBadge(hd){const k=methodOf(hd);return `<span class="badge meth-${k}">${methodInfo(k)[1]}</span>`;}
function methodHasLure(k){return k==="single"||k==="angeln";} // Lure nur bei Single & Angeln
/* kleiner roter Trank als Lure-Icon */
const LURE_ICON='<svg width="12" height="14" viewBox="0 0 20 24" style="vertical-align:-2px"><rect x="7" y="0" width="6" height="3" rx="1" fill="#b5651d"/><rect x="8.3" y="2.5" width="3.4" height="6" fill="#9fb8cc"/><path d="M8 8h4l3.4 6.6A5.9 5.9 0 1 1 4.6 14.6z" fill="#e23b3b" stroke="#9e1c1c" stroke-width="0.7"/><circle cx="8.3" cy="15" r="1.3" fill="#fff" opacity="0.45"/></svg>';
/* Untergrund / Habitat je Horde */
const HABITATS=[["","— Untergrund —"],["gras","🌿 Gras"],["dunkelgras","🌲 Dunkelgras"],["wasser","💧 Wasser"],["hoehle","⛰️ Höhle"]];
const HAB_COL={gras:"#5fd07a",dunkelgras:"#2f7d3f",wasser:"#4aa3ff",hoehle:"#b0895a"};
function habLabel(k){const e=HABITATS.find(x=>x[0]===k);return e?e[1]:"";}
function habStyle(hd){const c=HAB_COL[hd&&hd.hab];return c?`border-color:${c};box-shadow:inset 5px 0 0 ${c}`:"";}
function habBadge(hd){const k=hd&&hd.hab,c=HAB_COL[k];return c?`<span class="badge" style="background:${c};color:#10141c">${habLabel(k)}</span>`:"";}
function levelBadge(hd){return hd&&hd.level?`<span class="badge" style="background:var(--panel2);color:var(--text);border:1px solid var(--border)">🪜 ${esc(hd.level)}</span>`:"";}
function habSelect(id,cur){return `<select class="hab-sel" onchange="setHordeHab('${id}',this.value)">${HABITATS.map(([k,l])=>`<option value="${k}"${(cur||"")===k?" selected":""}>${l}</option>`).join("")}</select>`;}
function setHordeHab(id,v){const hd=HORDES.find(h=>h.id===id);if(hd){hd.hab=v||"";markHordesEdited();render();}}

function encRate(hd){return methodInfo(methodOf(hd))[2];} // max. Encounter/Stunde je Methode
function rating(hd){return encRate(hd)*effExpValue(hd);}  // Bewertung = Enc/h × effektiver Ø-Wert (inkl. Unique-Bonus)
/* Overall-Rang jeder Horde nach Bewertung (1 = beste), gleiche Bewertung = gleicher Platz.
   Wird über ALLE Horden (aktueller Filter) berechnet, damit der Platz auch beim Suchen sichtbar bleibt. */
let HORDE_RANKS={};
function computeHordeRanks(){
  HORDE_RANKS={};
  const arr=HORDES.map(hd=>({id:hd.id,r:Math.round(rating(hd))})).sort((a,b)=>b.r-a.r);
  let lastR=null, rank=0;
  arr.forEach((x,i)=>{ if(x.r!==lastR){ rank=i+1; lastR=x.r; } HORDE_RANKS[x.id]=rank; });
}
function rankBadgeHTML(hd){
  const r=HORDE_RANKS[hd.id]; if(!r) return "";
  const cls=r<=3?" top"+r:"";
  return `<span class="rankno${cls}" title="Platz ${r} nach Bewertung (gesamt)"><small>PLATZ</small>${r}</span>`;
}
function fmtNum(n){return Math.round(n).toLocaleString("de-DE");}
function pctOf(m){const v=m.s?m.s[SEASON]:0;return Number(v)||0;}
/* effektiver %-Wert: Lure-Mons fix 5% (nur wenn eingeblendet), sonst Saison × Tageszeit */
function activePct(m){
  if(m.lure) return LURE_ON?5:0;
  return todMatch(m)?pctOf(m):0;
}
function expValue(hd){return (hd.members||[]).reduce((s,m)=>{const l=resolve(m.name);return s+(activePct(m)/100)*(l?l.p:0);},0);}

/* Entwicklungslinien, die das Team bereits gefangen hat (aus caught) */
let CAUGHT_LINES=new Set();
function refreshCaughtLines(){
  CAUGHT_LINES=new Set();
  for(const c of (DATA.caught||[])){ const l=resolve(c.pokemon); if(l) CAUGHT_LINES.add(norm(l.e)); }
}
function teamHasLine(name){ const l=resolve(name); return l?CAUGHT_LINES.has(norm(l.e)):false; }
/* Effektiver Punktwert einer Species: Tier-Wert + 8 Unique-Bonus, falls Team-Linie noch offen */
function effPoints(name){ const l=resolve(name); if(!l) return 0; return l.p + (CAUGHT_LINES.has(norm(l.e))?0:8); }
/* Sichtbare Members für aktuellen Filter (Saison/Tageszeit/Lure), Prozente auf Summe=100 normalisiert.
   Bsp.: Magmar nur morgens/mittags -> nachts fällt er raus, Luxio wird auf 100% hochskaliert. */
function activeMembers(hd){
  const vis=(hd.members||[]).map(m=>({...m,raw:activePct(m),line:resolve(m.name)})).filter(m=>m.raw>0);
  const sum=vis.reduce((s,m)=>s+m.raw,0)||1;
  vis.forEach(m=>{ m.frac=m.raw/sum; });
  if(vis.length){ // Anzeige-Prozente exakt auf Summe=100 runden (Largest-Remainder)
    const exact=vis.map(m=>m.frac*100), floor=exact.map(Math.floor);
    const rest=100-floor.reduce((a,b)=>a+b,0);
    const order=exact.map((v,i)=>[v-floor[i],i]).sort((a,b)=>b[0]-a[0]);
    vis.forEach((m,i)=>m.pct=floor[i]);
    for(let k=0;k<rest && k<order.length;k++) vis[order[k][1]].pct++;
  }
  return vis.sort((a,b)=>b.raw-a.raw);
}
function effExpValue(hd){ return activeMembers(hd).reduce((s,m)=>s+m.frac*effPoints(m.name),0); }

let ED=null; // Editor-Status: null=zu, sonst {id, draft}
let SEARCH="";  // Pokémon-Suche (filtert Horden)
let LSEARCH=""; // Orts-/Region-Suche
function hordeLocKey(hd){return norm(hd.loc||"")+"|"+norm(hd.region||"");}
function setLocSearch(v){LSEARCH=v;applyHordeFilter();}
function clearAllSearch(){SEARCH="";LSEARCH="";render();}

/* Alle Such-Tokens einer Species: Name, DE, EN + ganze Entwicklungslinie */
function specTokens(name){
  const set=new Set(); const add=s=>{const k=norm(s);if(k)set.add(k);};
  add(name); const lab=speciesLabels(name); add(lab.de); add(lab.en);
  const l=resolve(name); if(l){ add(l.e); l.n.forEach(add); const ev=EN_LINES[l.e]; if(ev) ev.forEach(add); }
  return [...set];
}
function hordeSpec(hd){
  const set=new Set();
  (hd.members||[]).filter(m=>activePct(m)>0).forEach(m=>specTokens(m.name).forEach(t=>set.add(t)));
  return "|"+[...set].join("|")+"|";
}
function searchBarHTML(){
  return `<div class="bar" style="justify-content:flex-start;margin:0 0 12px">
    <input id="hordeSearch" list="specList" class="name-input" style="width:200px" placeholder="🔎 Pokémon…" value="${esc(SEARCH)}" oninput="setHordeSearch(this.value)" onchange="commitSearch(this.value)">
    <input id="locSearch" list="locList" class="name-input" style="width:200px" placeholder="🗺️ Ort / Region…" value="${esc(LSEARCH)}" oninput="setLocSearch(this.value)">
    <label class="lure-lbl" title="Lure-Encounter (5%) einblenden" style="align-self:center"><input type="checkbox" ${LURE_ON?"checked":""} onchange="setLure(this.checked)"> ${LURE_ICON} Lure anzeigen</label>
    ${(SEARCH||LSEARCH)?`<button class="btn" onclick="clearAllSearch()">✕ Filter löschen</button>`:""}
    <span class="ktag" id="hordeCount"></span>
  </div>`;
}
function setHordeSearch(v){SEARCH=v;applyHordeFilter();}
function clearHordeSearch(){SEARCH="";render();}
/* passt ein Member (inkl. Entwicklungslinie) zur Suchanfrage? */
function memberMatchesQuery(m,q){ return ("|"+specTokens(m.name).join("|")+"|").includes(q); }
/* beste Saison+Tageszeit finden, in der das gesuchte Pokémon in der höchstbewerteten Horde vorkommt */
function findBestFilters(query){
  const q=norm(query); if(!q) return null;
  const sS=SEASON, sT=TOD; let best=null;
  for(const [s] of SEASONS){ for(const [t] of TIMES){
    SEASON=s; TOD=t;
    for(const hd of HORDES){
      if(!(hd.members||[]).some(m=>activePct(m)>0 && memberMatchesQuery(m,q))) continue;
      const r=rating(hd);
      if(!best || r>best.rating) best={season:s,tod:t,rating:r};
    }
  }}
  SEASON=sS; TOD=sT; return best;
}
function commitSearch(v){
  SEARCH=v; const q=norm(v);
  if(q){
    const best=findBestFilters(v);
    if(best){
      SEASON=best.season; TOD=best.tod;
      try{localStorage.setItem("sw_season",SEASON);localStorage.setItem("sw_tod",TOD);}catch(e){}
      renderSeasonBar(); render();
      toast("🔎 Beste Kombi: "+seasonLabel()+" · "+(TIMES.find(x=>x[0]===TOD)||["",""])[1]);
      return;
    }
  }
  applyHordeFilter();
}
function applyHordeFilter(){
  const q=norm(SEARCH), lq=norm(LSEARCH), cnt=document.getElementById("hordeCount");
  let vis=0,total=0;
  document.querySelectorAll("#view .hcard").forEach(c=>{
    total++;
    const okS=!q||(c.dataset.spec||"").includes(q);
    const okL=!lq||(c.dataset.loc||"").includes(lq);
    const show=okS&&okL;
    c.style.display=show?"":"none"; if(show)vis++;
  });
  if(cnt) cnt.textContent = (q||lq) ? (vis+" Fundort"+(vis===1?"":"e")) : (total+" Horden");
}

}

    const luremark=(m.lure&&methodHasLure(methodOf(hd)))?`<span title="Nur mit Lure (Köder)" style="margin-left:2px">${LURE_ICON}</span>`:"";
    h+=`<div class="mrow">
      <div class="mname">${icon(m.name,line,'sm')} ${esc(memName(m.name))} ${tmark} ${line?tierBadge(line.t):'<span class="ktag">?</span>'} ${luremark} ${mark}</div>
      <div class="mtrack"><div class="mfill" style="width:${Math.min(100,m.pct)}%;background:${col}">${line?val+"p":""}</div></div>
      <div class="mpct">${m.pct}%</div>
    </div>`;
  }
  const rate=encRate(hd);
  const newLines=(hd.members||[]).filter(m=>{const l=resolve(m.name);return activePct(m)>0&&l&&!CAUGHT_LINES.has(norm(l.e));}).length;
  h+=`<p class="evexp">Ø Wert (${seasonLabel()}): <b>${ev.toFixed(1)} Pkt</b> pro Begegnung <span class="ktag">(Tier +8 für ${newLines} offene Linie${newLines===1?"":"n"})</span><br>
    Bewertung: <b style="color:var(--good)">${fmtNum(rating(hd))}</b> <span class="ktag">= max. ${fmtNum(rate)} Enc./h × Ø-Wert</span></p></div>`;
  return h;
}

function renderTierlist(){
  const total=LINES.length, caught=LINES.filter(l=>CAUGHT_LINES.has(norm(l.e))).length;
  let h=`<div class="card"><h2>📋 Tierlist</h2>
    <p class="hint"><span style="color:var(--good)">✓</span> = vom Team gefangen (<b>${caught}/${total}</b> Linien). Klick auf ein offenes Pokémon → springt zu den Horden und zeigt die besten Fundorte.</p>`;
  for(let t=0;t<8;t++){
    const lines=LINES.filter(l=>l.t===t);
    if(!lines.length) continue;
    const col=TIER_COLORS[t], pts=lines[0].p;
    const cc=lines.filter(l=>CAUGHT_LINES.has(norm(l.e))).length;
    h+=`<div class="hcard" style="border-color:${col};box-shadow:inset 5px 0 0 ${col}">
      <h3><span class="badge" style="background:${col};color:#10141c">Tier ${t}</span> <span style="color:${col};font-weight:700">${pts} Punkte</span> <span class="ktag">· ${cc}/${lines.length} gefangen</span></h3>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">`;
    for(const l of lines.slice().sort((a,b)=>a.n[0].localeCompare(b.n[0]))){
      if(CAUGHT_LINES.has(norm(l.e))){
        h+=`<span class="chip tl-done" title="vom Team gefangen"><span class="spwrap"><span style="color:var(--good);font-weight:800">✓</span> ${icon(l.n[0],l,'sm')} <s>${esc(l.n[0])}</s></span></span>`;
      }else{
        h+=`<span class="chip tl-open" data-n="${esc(l.n[0])}" onclick="gotoHordeSearch(this.dataset.n)" title="Zu den Horden – beste Fundorte anzeigen"><span class="spwrap">${icon(l.n[0],l,'sm')} ${esc(l.n[0])} <span class="ktag">${esc(l.e)}</span></span></span>`;
      }
    }
    h+=`</div></div>`;
  }
  h+=`</div>`;
  view.innerHTML=h;
}
function gotoHordeSearch(name){
  TAB="loc";
  document.querySelectorAll(".tab").forEach(el=>el.classList.toggle("active",el.dataset.tab==="loc"));
  renderSeasonBar();
  commitSearch(name);
}

function renderSplit(){
  if(!HORDES.length){
    view.innerHTML=`<div class="card"><h2>📊 Spezies-Split</h2>
      <p class="hint">Noch keine Horden angelegt. Wechsle zu „🗺️ Horden" und trag welche ein — hier siehst du dann die prozentuale Zusammensetzung je Saison.</p></div>`;
    return;
  }
  const ranked=[...HORDES].map(hd=>({hd,ev:effExpValue(hd),rt:rating(hd)})).sort((a,b)=>b.rt-a.rt);
  let h=`<div class="card"><h2>📊 Spezies-Split — ${seasonLabel()}</h2>
    <p class="hint">Prozentuale Zusammensetzung jeder Horde in dieser Saison, sortiert nach Bewertung (Pkt/Std). Farbe = Tier.</p>`;
  h+=searchBarHTML();
  for(const {hd,ev,rt} of ranked){
    const mem=activeMembers(hd);
    h+=`<div class="hcard" data-spec="${esc(hordeSpec(hd))}" data-loc="${esc(hordeLocKey(hd))}" style="${habStyle(hd)}"><h3>📍 ${esc(hd.loc||"—")} ${hd.region?`<span class="ktag">${esc(hd.region)}</span>`:""} ${methodBadge(hd)} ${habBadge(hd)} ${levelBadge(hd)}
      <span class="hactions evexp">Ø ${ev.toFixed(1)} · Bewertung <b style="color:var(--good)">${fmtNum(rt)}</b></span></h3>`;
    if(!mem.length){ h+=`<p class="loc-note">Keine %-Werte für ${seasonLabel()}.</p></div>`; continue; }
    h+=`<div class="stacked">`;
    for(const m of mem){
      const col=m.line?TIER_COLORS[m.line.t]:"#5c6b7a";
      const w=m.frac*100;
      h+=`<div title="${esc(memName(m.name))} — ${m.pct}%" style="width:${w}%;background:${col}">${w>9?esc(memName(m.name)):""}</div>`;
    }
    h+=`</div><div class="legend" style="justify-content:flex-start">`+
      mem.map(m=>`<span><span class="dot" style="background:${m.line?TIER_COLORS[m.line.t]:'#5c6b7a'}"></span>${esc(memName(m.name))} ${m.pct}%${m.line?` · T${m.line.t}·${m.line.p}p`:""}</span>`).join("")+
      `</div></div>`;
  }
  h+=`</div>`;
  view.innerHTML=h;
  applyHordeFilter();
}

/* ---------- Editor ---------- */
function hordeEditorHTML(){
  const d=ED.draft;
  let h=`<div class="editor" id="hordeEditor">
    <div class="frow">
      <input class="ed-loc${d.loc&&!isValidLocation(d.loc)?' bad':''}" id="ed_loc" list="locList" placeholder="Ort wählen (z.B. Route 119)…" value="${esc(d.loc)}" oninput="onLocInput(this)">
      <input class="ed-region" id="ed_region" list="regionList" placeholder="Region" value="${esc(d.region)}">
      <input id="ed_level" placeholder="Ebene (z.B. F1)" value="${esc(d.level||"")}" style="flex:0 0 110px;min-width:90px">
      <select class="ed-size" id="ed_method" onchange="onMethodChange()">${METHODS.map(([k,l])=>`<option value="${k}"${methodOf(d)===k?" selected":""}>${l}</option>`).join("")}</select>
      <select class="ed-size" id="ed_hab">${HABITATS.map(([k,l])=>`<option value="${k}"${(d.hab||"")===k?" selected":""}>${l}</option>`).join("")}</select>

    <div class="edhead">${SEASONS.map(([k,l])=>`<span class="seaslab">${l}</span>`).join("")}</div>
    <div id="ed_members">${d.members.map((m,i)=>memberRowHTML(m,i)).join("")}</div>
    <div class="bar" style="justify-content:flex-start;margin:8px 0 0">
      <button class="btn" onclick="addMemberRow()">+ Species</button>
      <button class="btn primary" onclick="saveHorde()">✓ Speichern</button>
      <button class="btn" onclick="cancelHorde()">Abbrechen</button>
      <span class="ktag" style="align-self:center">Pro Species %-Wert je Saison (0–100). Leer = 0.</span>
    </div>

}
function memberRowHTML(m,i){
  const s=m.s||{};
  const has=!!m.name, valid=has?isValidSpecies(m.name):null;
  const line=has?resolve(m.name):null;
  const prev=has?(valid?icon(m.name,line,'sm'):'<span class="mono spr-sm" style="background:#5c6b7a">?</span>'):'';
  const enTxt=valid?labelText(m.name):(valid===false?"✗ kein Pokémon":"");
  return `<div class="edrow" data-i="${i}">
    <span class="em_prev">${prev}</span>
    <input class="em_name${valid===false?' bad':valid?' good':''}" list="specList" placeholder="Species (DE/EN)" value="${esc(m.name||"")}" oninput="onSpecInput(this)">
    <span class="em_en ktag${valid===false?' bad-txt':''}">${esc(enTxt)}</span>
    ${SEASONS.map(([k])=>`<input class="seasin em_${k}" type="number" min="0" max="100" placeholder="%" value="${s[k]!=null&&s[k]!==""?s[k]:""}">`).join("")}
    <select class="tod-sel em_tod" title="Tageszeit">${TOD_EDIT.map(([k,l])=>`<option value="${k}"${(m.tod||"immer")===k?" selected":""}>${l}</option>`).join("")}</select>
    ${(ED&&ED.draft&&methodHasLure(ED.draft.method))?`<label class="lure-lbl" title="Nur mit Köder/Lure"><input type="checkbox" class="em_lure" ${m.lure?"checked":""}> ${LURE_ICON} Lure</label>`:""}
    <button class="xbtn" onclick="removeMemberRow(${i})" title="Entfernen">✕</button>
  </div>`;
}
function readEditor(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
  const rows=[...document.querySelectorAll("#ed_members .edrow")];
  const members=rows.map(r=>{
    const s={};
    SEASONS.forEach(([k])=>{const v=r.querySelector(".em_"+k).value;s[k]=v===""?0:Math.max(0,Math.min(100,Number(v)||0));});
    const tsel=r.querySelector(".em_tod"), lb=r.querySelector(".em_lure");
    return {name:r.querySelector(".em_name").value.trim(),s,tod:tsel?tsel.value:"immer",lure:lb?lb.checked:false};
  });
  return {loc:g("ed_loc"),region:g("ed_region"),level:g("ed_level"),note:g("ed_note"),method:g("ed_method"),hab:g("ed_hab"),members};
}
function openNewHorde(){ED={id:null,draft:{loc:"",region:"",level:"",note:"",method:"horde5",hab:"",members:[{name:"",s:{},tod:"immer",lure:false}]}};render();}
function openEditHorde(id){const hd=HORDES.find(h=>h.id===id);if(!hd)return;
  ED={id,draft:JSON.parse(JSON.stringify({loc:hd.loc||"",region:hd.region||"",level:hd.level||"",note:hd.note||"",method:methodOf(hd),hab:hd.hab||"",members:(hd.members&&hd.members.length?hd.members:[{name:"",s:{},tod:"immer",lure:false}])}))};render();}
function cancelHorde(){ED=null;render();}
function onMethodChange(){ED.draft=readEditor();render();}
function addMemberRow(){ED.draft=readEditor();ED.draft.members.push({name:"",s:{},tod:"immer",lure:false});render();}
function removeMemberRow(i){ED.draft=readEditor();ED.draft.members.splice(i,1);if(!ED.draft.members.length)ED.draft.members.push({name:"",s:{},tod:"immer",lure:false});render();}
function saveHorde(){
  const d=readEditor();
  if(!d.loc){toast("Bitte einen Ort angeben",true);return;}
  const named=d.members.filter(m=>m.name);
  const bad=named.find(m=>!isValidSpecies(m.name));
  if(bad){toast("Kein gültiges Pokémon: „"+bad.name+"“",true);return;}
  d.members=named.map(m=>({name:canonSpecies(m.name),s:m.s,tod:m.tod||"immer",lure:!!m.lure}));
  if(ED.id){const hd=HORDES.find(h=>h.id===ED.id);if(hd)Object.assign(hd,d);}
  else HORDES.push({id:"h"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),...d});
  markHordesEdited(); ED=null; toast("✓ Horde gespeichert"); render();
}
function deleteHorde(id){const hd=HORDES.find(h=>h.id===id);if(!confirm("Horde \""+(hd?hd.loc:"")+"\" löschen?"))return;
  HORDES=HORDES.filter(h=>h.id!==id);markHordesEdited();toast("Horde gelöscht");render();}
function duplicateHorde(id){
  const i=HORDES.findIndex(h=>h.id===id); if(i<0) return;
  const copy=JSON.parse(JSON.stringify(HORDES[i]));
  copy.id="h"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  HORDES.splice(i+1,0,copy);
  markHordesEdited(); toast("Kachel dupliziert — jetzt für die andere Ebene anpassen"); render();
}

function exportHordes(){
  const blob=new Blob([JSON.stringify({hordes:HORDES},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="hordes.json";
  document.body.appendChild(a);a.click();a.remove();
  setHordesDirty(false); // veröffentlicht -> nicht mehr "dirty"
  toast("⬇ hordes.json exportiert — jetzt ins Repo committen"); render();
}
function exportHunts(){
  // IDs wieder als Zahlen ausgeben (bot-kompatibel), inkl. der gesetzten Sonderfall-Flags
  const t=JSON.stringify(DATA,null,2).replace(/"(\d{16,})"(?!\s*:)/g,'$1');
  const blob=new Blob([t],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="hunts.json";
  document.body.appendChild(a);a.click();a.remove();toast("⬇ hunts.json exportiert");
}
/* Rohes Horden-Array in HORDES übernehmen (von Import ODER Repo-Auto-Load genutzt) */
function applyHordes(arr){
  HORDES=arr.map(h=>({id:h.id||("h"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),
    loc:h.loc||"",region:h.region||"",level:h.level||"",note:h.note||"",method:h.method||(h.size===3?"horde3":"horde5"),hab:h.hab||"",
    members:(h.members||[]).map(m=>{
      let s=m.s;
      if((!s||!Object.keys(s).length) && m.p!=null){const v=Number(m.p)||0; s={fruehling:v,sommer:v,herbst:v,winter:v};}
      return {name:m.name||"",s:s||{},tod:m.tod||"immer",lure:!!m.lure};
    })}));
  saveHordes(); setHordesDirty(false); // Import/Repo = bekannter Stand -> sauber
}
function importHordes(input){
  const f=input.files[0];if(!f)return;input.value="";
  const r=new FileReader();
  r.onload=()=>{try{
    const o=JSON.parse(r.result);
    const arr=Array.isArray(o)?o:(o.hordes||[]);
    if(!Array.isArray(arr))throw new Error("kein hordes-Array gefunden");
    applyHordes(arr);ED=null;toast("⬆ "+HORDES.length+" Horden importiert");render();
  }catch(e){toast("✗ Import fehlgeschlagen: "+e.message,true);}};
  r.readAsText(f);
}
/* ---- Auto-Load aus dem Repo (GitHub Pages), damit alle denselben Stand sehen ---- */
const REPO_HORDES_URL="hordes.json"; // liegt im Repo -> wird automatisch geladen
const REPO_HUNTS_URL="hunts.json";   // nur wenn der Bot sie ins Repo pusht (sonst 404 -> ignoriert)
async function loadRepoData(){
  if(!location.protocol.startsWith("http")) return; // lokal per Datei geöffnet -> kein Auto-Load
  // Repo-Stand laden, AUSSER es gibt ungespeicherte lokale Änderungen (dirty)
  if(!hordesDirty() && (!ADMIN || !HORDES.length)){
    try{ const r=await fetch(REPO_HORDES_URL+"?t="+Date.now());
      if(r.ok){ const j=await r.json(); const arr=Array.isArray(j)?j:(j.hordes||[]); if(arr.length) applyHordes(arr); } }catch(e){}
  }
  // Hunts: immer den neuesten Bot-Stand (falls im Repo veröffentlicht)
  if(REPO_HUNTS_URL){
    try{ const r=await fetch(REPO_HUNTS_URL+"?t="+Date.now());
      if(r.ok){ const j=parseHunts(await r.text()); if(j&&(j.active||j.caught)){ DATA=j; saveData(); if(j.users){Object.assign(NAMES,j.users);saveNames();} } } }catch(e){}
  }
  refreshCaughtLines(); render();
}
async function pullRepo(){ // Admin-Button: Repo-Horden manuell laden
  try{ const r=await fetch(REPO_HORDES_URL+"?t="+Date.now());
    if(r.ok){ const j=await r.json(); const arr=Array.isArray(j)?j:(j.hordes||[]); applyHordes(arr); ED=null; toast("⟳ "+HORDES.length+" Horden aus Repo geladen"); render(); return; } }catch(e){}
  toast("✗ Repo-Horden nicht erreichbar",true);
}
function seedExampleHorde(){

    note:"Sweet Scent — nur ein Format-Beispiel, bitte durch echte Event-Horden ersetzen",

}

function renderNames(){
  // alle bekannten IDs sammeln
  const ids=new Set();
  Object.values(DATA.active||{}).forEach(arr=>arr.forEach(i=>ids.add(String(i))));
  (DATA.caught||[]).forEach(c=>ids.add(String(c.user_id)));
  let h=`<div class="card"><h2>👤 Spieler-Namen</h2>
    <p class="hint">Der Bot speichert nur Discord-IDs.${ADMIN?" Ordne hier Namen zu — lokal gespeichert und überall angezeigt.":" (Bearbeiten nur im Admin-Modus.)"}</p>
    <table><thead><tr><th>Discord-ID</th><th>Name</th></tr></thead><tbody>`;
  for(const id of [...ids].sort()){
    const cell = ADMIN
      ? `<input class="name-input" value="${(NAMES[id]||'').replace(/"/g,'&quot;')}" placeholder="Name eingeben…" oninput="NAMES['${id}']=this.value.trim();saveNames()">`
      : `${NAMES[id]?esc(NAMES[id]):'<span class="ktag">—</span>'}`;
    h+=`<tr><td><code>${id}</code></td><td>${cell}</td></tr>`;
  }
  h+=`</tbody></table></div>`;

}

/* ============================================================
   LADEN
   ============================================================ */
let DB_LOADED=Object.keys(POKEDB).length>0;
function isPokedb(obj){
  if(!obj||typeof obj!=="object"||Array.isArray(obj)) return false;
  const v=Object.values(obj)[0];
  return v && typeof v==="object" && ("sprite" in v || "name_de" in v);
}
function applyPokedb(obj){
  POKEDB={};
  for(const [k,rec] of Object.entries(obj)){
    POKEDB[norm(k)]=rec;
    if(rec.name_de) POKEDB[norm(rec.name_de)]=rec;
    if(rec.name_en) POKEDB[norm(rec.name_en)]=rec;
  }
  DB_LOADED=true;
  savePokedb(); buildSpeciesOptions(); ensureDatalists();
  render();
}
function applyData(obj){
  DATA=obj; saveData();
  if(obj.users && typeof obj.users==="object"){ Object.assign(NAMES,obj.users); saveNames(); }
  refreshCaughtLines();
  render();
}
function setStatus(msg,cls){
  const s=document.getElementById("status");
  const dbtag = DB_LOADED ? ' · <span style="color:var(--good)">🖼️ Voller Pokédex (DE+EN) aktiv</span>'
                          : ' · <span class="ktag">Bilder via PokeAPI · pokemon_data.json laden für alle DE-Namen</span>';
  s.innerHTML=msg+dbtag; s.className="status "+(cls||"");
}
/* Discord-IDs (18–19-stellig) übersteigen JS-Zahlgenauigkeit -> vor dem Parsen in Strings wandeln,
   damit user_id exakt bleibt und zum "users"-Feld passt. */
function quoteBigInts(t){ return String(t).replace(/(?<!["\d])(\d{16,})(?!["\d])/g, '"$1"'); }
function parseHunts(t){ return JSON.parse(quoteBigInts(t)); }

function handleFile(f){
  if(!ADMIN){ toast("Upload nur im Admin-Modus möglich",true); return; }
  const r=new FileReader();
  r.onload=()=>{ try{
      const obj=JSON.parse(quoteBigInts(r.result));
      if(isPokedb(obj)){
        applyPokedb(obj);
        setStatus("✓ "+f.name+" (Bilder) geladen","ok");
        toast("🖼️ Bilder geladen: "+Object.keys(obj).length+" Einträge");
      } else {
        applyData(obj);
        const na=Object.keys(obj.active||{}).length, nc=(obj.caught||[]).length;
        setStatus("✓ "+f.name+" geladen","ok");
        toast("✓ "+f.name+": "+na+" aktive Hunts · "+nc+" Shinys");
      }
    }catch(err){ setStatus("✗ Ungültiges JSON: "+err.message,"err"); toast("✗ Ungültiges JSON — ist das die richtige Datei?",true); } };
  r.onerror=()=>{ toast("✗ Datei konnte nicht gelesen werden",true); };
  r.readAsText(f);
}
document.getElementById("file").addEventListener("change",e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); e.target.value=""; });
document.getElementById("dbfile").addEventListener("change",e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); e.target.value=""; });
function loadFromUrl(){
  const url=prompt("URL zur hunts.json oder pokemon_data.json (öffentlich/CORS-fähig):");
  if(!url) return;
  setStatus("Lade…");
  fetch(url).then(r=>r.text()).then(t=>{
    const j=parseHunts(t);
    if(isPokedb(j)){ applyPokedb(j); setStatus("✓ Bilder von URL geladen","ok"); }
    else { applyData(j); setStatus("✓ Von URL geladen","ok"); }
  }).catch(e=>setStatus("✗ Fehler: "+e.message,"err"));
}
function useDemo(){ applyData(JSON.parse(JSON.stringify(DEMO))); setStatus("Beispieldaten geladen"); }

/* Drag & Drop überall (mehrere Dateien möglich: hunts.json + pokemon_data.json) */
document.addEventListener("dragover",e=>{e.preventDefault();});
document.addEventListener("drop",e=>{
  e.preventDefault();
  const files=[...e.dataTransfer.files]; if(!files.length) return;
  files.forEach(f=>handleFile(f));
});

buildLocOptions();
ensureDatalists();
refreshCaughtLines();

renderSeasonBar();
render();
